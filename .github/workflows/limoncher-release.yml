name: LimonCher Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limoncher-release-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE: ":LimonCher"
  VERSION_NAME: "0.3.8-AndroidVer"
  VERSION_CODE: "38"
  BUILD_NAME: "038-AndroidVer-LimonCher"
  PACKAGE_NAME: "com.limone.limoncher"
  DEVELOPER: "Limone Production, RedzDev"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            abi: armeabi-v7a
            label: ARM
          - arch: arm64
            abi: arm64-v8a
            label: ARM64
          - arch: x86
            abi: x86
            label: x86
          - arch: x86_64
            abi: x86_64
            label: x86_64
          - arch: all
            abi: universal
            label: Universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 35 and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew \
            "$MODULE:assembleRelease" \
            -Darch="${{ matrix.arch }}" \
            --no-daemon \
            --max-workers=2

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(LimonCher/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            ls -lh "$apk"
          done

      - name: Collect release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          apks=(LimonCher/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            cp "$apk" "release-assets/LimonCher-${VERSION_NAME}-${{ matrix.arch }}.apk"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimonCher-${{ matrix.arch }}-${{ env.VERSION_NAME }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag and number
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}-r${GITHUB_RUN_NUMBER}"
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download all matrix APKs
        uses: actions/download-artifact@v4
        with:
          pattern: LimonCher-*-${{ env.VERSION_NAME }}
          merge-multiple: true
          path: release-assets

      - name: Verify release set
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release-assets
          count=$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$count" -eq 5

      - name: Generate release description
        shell: bash
        run: |
          cat > release-body.md <<EOF
          # LimonCher ${VERSION_NAME}

          Modern, lightweight Minecraft Java Launcher for Android.

          ## Application

          - Developer: ${DEVELOPER}
          - Package: \`${PACKAGE_NAME}\`
          - Version: ${VERSION_NAME}
          - Version Code: ${VERSION_CODE}
          - Build: ${BUILD_NAME}
          - Release: #${GITHUB_RUN_NUMBER}

          ## Architectures

          - ARM — \`armeabi-v7a\`
          - ARM64 — \`arm64-v8a\`
          - x86 — \`x86\`
          - x86_64 — \`x86_64\`
          - Universal — all supported ABIs

          ## Authentication

          Microsoft, Ely.by/Yggdrasil-compatible accounts, and offline profiles supported by the launcher.

          ## Build

          Built automatically by GitHub Actions.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "LimonCher ${VERSION_NAME} • Release #${{ steps.release.outputs.release_number }}"
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: release-assets/*.apk
