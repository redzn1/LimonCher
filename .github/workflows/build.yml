name: LimonCher Android Build

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v0.6.3-AndroidVer)"
        required: false
        default: "v0.6.3-AndroidVer"
        type: string

permissions:
  contents: write

concurrency:
  group: limoncher-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE: ":LimonCher"
  VERSION_NAME: "0.6.3-AndroidVer"
  VERSION_CODE: "603"
  BUILD_NAME: "063-AndroidVer-LimonCher"
  PACKAGE_NAME: "com.limone.limoncher"
  DEVELOPER: "Limone Production"
  ANDROID_PLATFORM: "android-35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "25.2.9519653"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            abi: armeabi-v7a
            label: ARM

          - arch: arm64
            abi: arm64-v8a
            label: ARM64

          - arch: x86
            abi: x86
            label: x86

          - arch: x86_64
            abi: x86_64
            label: x86_64

          - arch: all
            abi: universal
            label: Universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-37|build-tools;35.0.0|ndk;25.2.9519653' || true

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIMONCHER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LIMONCHER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LIMONCHER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIMONCHER_KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p LimonCher

          if [[ -n "${KEYSTORE_B64:-}" &&
                -n "${STORE_PASSWORD:-}" &&
                -n "${KEY_PASSWORD:-}" &&
                -n "${KEY_ALIAS:-}" ]]; then

            echo "Release signing: configured"

            printf '%s' "$KEYSTORE_B64" |
              base64 --decode > LimonCher/limoncher-release.jks

            test -s LimonCher/limoncher-release.jks

            keytool \
              -list \
              -keystore LimonCher/limoncher-release.jks \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            {
              echo "STORE_PASSWORD=$STORE_PASSWORD"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"

          else
            echo "Release signing secrets not configured."
            echo "Project signing configuration will use its configured fallback."
          fi

      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            "${MODULE}:assembleRelease" \
            "-Parch=${{ matrix.arch }}" \
            "--max-workers=2"

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          apks=(
            "${MODULE#:}/build/outputs/apk/release/"*.apk
          )

          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo "No APK was generated."
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "Generated APK:"
          printf '%s\n' "${apks[@]}"

          apk="${apks[0]}"

          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          apk="${{ steps.apk.outputs.path }}"

          cp "$apk" \
            "release-assets/LimonCher-${VERSION_NAME}-${{ matrix.arch }}.apk"

          sha256sum \
            "release-assets/LimonCher-${VERSION_NAME}-${{ matrix.arch }}.apk" \
            >> release-assets/SHA256SUMS.txt

          ls -lh release-assets

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimonCher-${{ matrix.arch }}-${{ env.VERSION_NAME }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"

          elif [[ -n "${INPUT_TAG}" ]]; then
            RELEASE_TAG="${INPUT_TAG}"

          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Download all matrix APKs
        uses: actions/download-artifact@v4
        with:
          pattern: LimonCher-*-${{ env.VERSION_NAME }}
          merge-multiple: true
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release: ${RELEASE_TAG}"
          echo

          echo "Assets:"
          find release-assets -maxdepth 1 -type f -print | sort
          echo

          apk_count="$(
            find release-assets \
              -maxdepth 1 \
              -type f \
              -name '*.apk' |
              wc -l
          )"

          if [[ "$apk_count" -ne 5 ]]; then
            echo "Expected 5 APKs, found ${apk_count}."
            exit 1
          fi

          echo "All 5 APKs are present."

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          cat > release-body.md <<EOF
          # LimonCher ${VERSION_NAME}

          Modern Minecraft: Java Edition launcher for Android.

          ## Application

          | Property | Value |
          |---|---|
          | Name | LimonCher |
          | Version | ${VERSION_NAME} |
          | Version Code | ${VERSION_CODE} |
          | Build | ${BUILD_NAME} |
          | Package | \`${PACKAGE_NAME}\` |
          | Developer | ${DEVELOPER} |

          ## Architectures

          - ARM — \`armeabi-v7a\`
          - ARM64 — \`arm64-v8a\`
          - x86 — \`x86\`
          - x86_64 — \`x86_64\`
          - Universal — all supported ABIs

          ## Launcher

          - Minecraft: Java Edition focused interface
          - Microsoft account support
          - Ely.by / Yggdrasil-compatible account support
          - Offline profiles
          - Installation and version management
          - Mods and profile management
          - Skins and capes support
          - GitHub-based launcher update system

          ## Update marker

          Releases containing \`-lcto-\` in the release notes are treated by
          the launcher as launcher updates.

          ## Build information

          Commit: \`${GITHUB_SHA}\`

          Workflow: \`${GITHUB_WORKFLOW}\`

          Run: \`#${GITHUB_RUN_NUMBER}\`
          EOF

          cat release-body.md
          echo

          echo "Checksums:"
          cat release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: "LimonCher ${{ env.VERSION_NAME }}"
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
