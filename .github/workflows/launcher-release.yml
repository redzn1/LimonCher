name: LimonCher Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limoncher-release-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE: ":LimonCher"
  VERSION_NAME: "0.5.6-AndroidVer"
  VERSION_CODE: "506"
  BUILD_NAME: "056-AndroidVer-LimonCher"
  PACKAGE_NAME: "com.limone.limoncher"
  DEVELOPER: "Limone Production, RedzDev"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            label: ARM
          - arch: arm64
            label: ARM64
          - arch: x86
            label: x86
          - arch: x86_64
            label: x86_64
          - arch: all
            label: Universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIMONCHER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LIMONCHER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LIMONCHER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIMONCHER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > LimonCher/limoncher-release.jks
            printf '%s' "$STORE_PASSWORD" > LimonCher/.store_password.txt
            printf '%s' "$KEY_PASSWORD" > LimonCher/.key_password.txt
            printf '%s' "${KEY_ALIAS:-limoncher}" > LimonCher/.key_alias.txt
            keytool -list \
              -keystore LimonCher/limoncher-release.jks \
              -storepass "$STORE_PASSWORD" \
              -alias "${KEY_ALIAS:-limoncher}" >/dev/null
          else
            echo "::warning::No release signing secrets. This run will use the runner's debug signing key; do not use it for upgrade-compatible production distribution."
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew \
            "$MODULE:assembleRelease" \
            -Darch="${{ matrix.arch }}" \
            --no-daemon \
            --max-workers=2

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(LimonCher/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            ls -lh "$apk"
          done

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          apks=(LimonCher/build/outputs/apk/release/*.apk)
          for apk in "${apks[@]}"; do
            cp "$apk" "release-assets/LimonCher-${VERSION_NAME}-${{ matrix.arch }}.apk"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimonCher-${{ matrix.arch }}-${{ env.VERSION_NAME }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LimonCher-*-${{ env.VERSION_NAME }}
          merge-multiple: true
          path: release-assets

      - name: Verify release set
        shell: bash
        run: |
          set -euo pipefail
          count=$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$count" -eq 5
          ls -lah release-assets

      - name: Generate release description
        shell: bash
        run: |
          cat > release-body.md <<EOF
          # LimonCher ${VERSION_NAME}

          Minecraft: Java Edition focused launcher for Android.

          ## Release Information

          - Developer: ${DEVELOPER}
          - Package: \`${PACKAGE_NAME}\`
          - Version: ${VERSION_NAME}
          - Version Code: ${VERSION_CODE}
          - Build: ${BUILD_NAME}

          ## Downloads

          - ARM — \`armeabi-v7a\`
          - ARM64 — \`arm64-v8a\`
          - x86 — \`x86\`
          - x86_64 — \`x86_64\`
          - Universal — all supported ABIs

          ## Features

          - Minecraft Java Edition focused UI
          - Play / Installations / Realms / Mods / Skins / Patch Notes navigation
          - Microsoft, Ely.by/Yggdrasil-compatible and Offline accounts
          - Minecraft capes for supported online accounts
          - Local PNG cape import for custom/offline profiles
          - In-app launcher update flow
          - Performance and stability improvements

          ## Update

          Android can install a newer APK over an existing installation without uninstalling
          when the application ID, signing key, and version code are compatible.

          Built automatically from commit \`${GITHUB_SHA}\`.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "LimonCher ${{ env.VERSION_NAME }}"
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: release-assets/*.apk
