# LimonCher Gradle configuration
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.workers.max=2

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false

# Kotlin
kotlin.code.style=official

# LimonCher branding
launcher_name=LimonCher
launcher_app_name=LimonCher
launcher_short_name=LC
launcher_version_code=38
launcher_version_name=0.3.8-AndroidVer
url_home=https://github.com/

# Optional services
# oauth_client_id=...
# curseforge_api_key=...
